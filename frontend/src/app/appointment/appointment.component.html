<div class="appointment-page">
  <div class="appointment-card">
    <h1>Book Appointment</h1>
    <p class="subtitle">Choose a doctor, date, and time for your visit</p>
    @if (loadingDoctors) {
      <p>Loading doctors...</p>
    }
    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }
    @if (successMessage) {
      <p class="success">{{ successMessage }}</p>
    }
    <div class="form-group">
      <label for="doctor">Select Doctor</label>
      <select id="doctor" [(ngModel)]="selectedDoctorId">
        <option [ngValue]="null">Choose doctor</option>
        @for (doctor of doctors; track doctor.id) {
          <option [ngValue]="doctor.id">
            Dr. {{ doctor.first_name }} {{ doctor.last_name }} — {{ doctor.specialization }} — Room {{ doctor.room_number }}
          </option>
        }
      </select>
    </div>
    <div class="form-group">
      <label for="date">Date</label>
      <input id="date" type="date" [(ngModel)]="appointmentDate">
    </div>
    <div class="form-group">
      <label for="time">Time</label>
      <input id="time" type="time" [(ngModel)]="appointmentTime">
    </div>
    <button class="book-btn" (click)="bookAppointment()">
      Book Appointment
    </button>
  </div>
</div>
